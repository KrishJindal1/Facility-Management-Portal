name: CI/CD Pipeline

'on':
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Database & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: facility_management_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/facility_management_test
      APP_ENV: test
      AI_PROVIDER: mock
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Environment & Dialect Support
        run: |
          python --version
          python -c "import psycopg2, sqlalchemy, streamlit; print('Core dependencies loaded successfully')"

      - name: Initialize PostgreSQL Database Schema & Seed Data
        run: |
          python -m database.init_db

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  deploy:
    name: Deploy to Render Production
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not configured in GitHub repository secrets."
            echo "Skipping deployment. To enable automated Render deployments after CI passes:"
            echo "1. Go to Render Dashboard -> Web Service -> Settings -> Deploy Hook."
            echo "2. Copy the Deploy Hook URL."
            echo "3. Add it as 'RENDER_DEPLOY_HOOK_URL' in GitHub repo Settings -> Secrets and variables -> Actions."
            exit 0
          fi

          echo "Triggering Render deployment for commit ${{ github.sha }} on branch main..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Render deploy response: $BODY"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Render deployment hook triggered successfully (HTTP $HTTP_STATUS)."
          else
            echo "::error::Render deployment hook failed with HTTP $HTTP_STATUS: $BODY"
            exit 1
          fi

      - name: Verify Production Deployment Health
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "RENDER_SERVICE_URL secret not set. Skipping post-deploy health check ping."
            echo "To enable automated post-deploy verification, set 'RENDER_SERVICE_URL' (e.g. https://homedesk-facility-portal.onrender.com) in GitHub repository secrets."
            exit 0
          fi

          HEALTH_URL="${RENDER_SERVICE_URL%/}/_stcore/health"
          echo "Starting health verification loop for $HEALTH_URL..."

          MAX_ATTEMPTS=30
          SLEEP_SECONDS=10
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Health check attempt $ATTEMPT of $MAX_ATTEMPTS..."
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$HEALTH_URL" || true)

            if [ "$STATUS_CODE" = "200" ]; then
              echo "Production service is healthy and responsive (HTTP 200 OK)."
              exit 0
            fi

            echo "Status code: $STATUS_CODE. Waiting $SLEEP_SECONDS seconds for Render build/boot..."
            sleep $SLEEP_SECONDS
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "::error::Production service healthcheck failed to respond with HTTP 200 within $((MAX_ATTEMPTS * SLEEP_SECONDS)) seconds."
          exit 1
